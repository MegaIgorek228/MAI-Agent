services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-mai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mai_agent}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-mai_agent}
      ACP_TRANSPORT: ${ACP_TRANSPORT:-stdio}
      HERMES_COMMAND: ${HERMES_COMMAND:-hermes-acp}
      HERMES_CWD: ${HERMES_CWD:-/app}
      ACP_STARTUP_TIMEOUT_SECONDS: ${ACP_STARTUP_TIMEOUT_SECONDS:-180}
      ACP_PROMPT_TIMEOUT_SECONDS: ${ACP_PROMPT_TIMEOUT_SECONDS:-600}
      HERMES_MAX_PROCESSES: ${HERMES_MAX_PROCESSES:-8}
      HERMES_IDLE_TIMEOUT_SECONDS: ${HERMES_IDLE_TIMEOUT_SECONDS:-900}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://backend:8000/mcp}
      LLM_BASE_URL: ${LLM_BASE_URL:-${QWEN_BASE_URL:-https://api-ai.mai.ru/v1}}
      LLM_API_KEY: ${LLM_API_KEY:-${QWEN_API_KEY:-}}
      OPENAI_API_KEY: ${LLM_API_KEY:-${QWEN_API_KEY:-}}
      HERMES_MODEL: ${HERMES_MODEL:-${QWEN_MODEL:-deepseek-v4.1-flash}}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-${LLM_BASE_URL:-${QWEN_BASE_URL:-https://api-ai.mai.ru/v1}}}
      HERMES_REASONING_EFFORT: ${HERMES_REASONING_EFFORT:-low}
      SSL_CERT_FILE: ${AI_API_CA_BUNDLE:-}
      REQUESTS_CA_BUNDLE: ${AI_API_CA_BUNDLE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLLING_TIMEOUT_SECONDS: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:-10}
      # Hermes' tirith security scanner auto-downloads a binary from GitHub on
      # first use; the container has no unrestricted egress and the download
      # hangs the agent turn. Disable it (inherited by hermes-acp via env).
      TIRITH_ENABLED: "false"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/app/certs:ro
      # Hermes session store (state.db) + MEMORY.md: must survive container
      # recreation so agent sessions and long-term memory persist.
      - hermes_home:/root/.hermes
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  hermes_home:
