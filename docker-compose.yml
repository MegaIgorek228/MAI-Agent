services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-mai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mai_agent}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-mai_agent}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_local_environment}
      ACP_TRANSPORT: ${ACP_TRANSPORT:-stdio}
      HERMES_COMMAND: ${HERMES_COMMAND:-hermes-acp}
      HERMES_CWD: ${HERMES_CWD:-/app}
      ACP_STARTUP_TIMEOUT_SECONDS: ${ACP_STARTUP_TIMEOUT_SECONDS:-180}
      ACP_PROMPT_TIMEOUT_SECONDS: ${ACP_PROMPT_TIMEOUT_SECONDS:-600}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://backend:8000/mcp}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      AI_API_CA_BUNDLE: ${AI_API_CA_BUNDLE:-}
      OPENAI_BASE_URL: ${QWEN_BASE_URL:-https://api-ai.mai.ru/v1}
      OPENAI_API_KEY: ${QWEN_API_KEY:-}
      HERMES_INFERENCE_MODEL: ${QWEN_MODEL:-qwen3.8-27b}
      HERMES_PROVIDER: openai
      SSL_CERT_FILE: ${AI_API_CA_BUNDLE:-}
      REQUESTS_CA_BUNDLE: ${AI_API_CA_BUNDLE:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      OFFICIAL_SOURCE_DOMAINS: ${OFFICIAL_SOURCE_DOMAINS:-mai.ru,priem.mai.ru}
      OFFICIAL_SOURCE_ROOT_URLS: ${OFFICIAL_SOURCE_ROOT_URLS:-https://mai.ru,https://priem.mai.ru}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLLING_TIMEOUT_SECONDS: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:-10}
      # Hermes' tirith security scanner auto-downloads a binary from GitHub on
      # first use; the container has no unrestricted egress and the download
      # hangs the agent turn. Disable it (inherited by hermes-acp via env).
      TIRITH_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
