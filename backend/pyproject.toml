[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mai-agent-backend"
version = "0.1.0"
description = "FastAPI backend for MAI-Agent"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "agent-client-protocol==0.9.0",
    "fastapi>=0.115,<1",
    "fastmcp==2.14.7",
    "email-validator>=2.2,<3",
    # ddgs is the keyless DuckDuckGo search backend for hermes-agent's web
    # tools. hermes gates BOTH web_search and web_extract on check_web_api_key(),
    # which returns True when any web backend is usable; for the "ddgs" backend
    # that check is simply "is the ddgs package importable" (no API key).
    # Installing it lights up web_extract so the agent can fetch official
    # MAI admission pages (priem.mai.ru) without a paid search credential.
    "ddgs>=9,<10",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pypdf>=5,<7",
    # Direct dependency: the MCP fetch_web_page tool strips HTML with lxml
    # (also pulled transitively by python-docx, but declared explicitly).
    "lxml>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.18,<1",
    "Pillow>=11,<13",
    "openai>=2.24,<3",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
hermes = ["hermes-agent[acp]==0.19.0"]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
where = ["."]
