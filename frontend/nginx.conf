server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
    }

    location /users/ {
        proxy_pass http://backend:8000/users/;
    }

    location /applicant/ {
        client_max_body_size 11m;
        proxy_pass http://backend:8000/applicant/;
    }

    location /chat/ {
        proxy_read_timeout 620s;
        proxy_pass http://backend:8000/chat/;
    }

    location /knowledge/ {
        proxy_pass http://backend:8000/knowledge/;
    }

    location = /ready {
        proxy_pass http://backend:8000/ready;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /mcp/ {
        proxy_pass http://backend:8000/mcp/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
